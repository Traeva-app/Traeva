[package]
name = "traeva-xlsx-validation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[[bin]]
name = "xlsx-core-probe"
path = "probe.rs"

[dependencies]
traeva-core = { path = "../.." }
quick-xml = { version = "=0.42.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
