[package]
name = "traeva-pdf-ocr-core-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
traeva-core = { path = "../../crates/traeva-core" }
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-syntax = { version = "=0.8.0", default-features = false }
kurbo = "=0.13.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
memchr = "=2.8.3"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-vision = { version = "=0.3.2", features = ["objc2-core-graphics", "objc2-image-io"] }

[dev-dependencies]
sha2 = "=0.11.0"
